# Local dev only: Postgres + Redis on non-default host ports so they don't clash with other projects.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: christlink
      POSTGRES_PASSWORD: christlink
      POSTGRES_DB: christlink
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U christlink']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - '6380:6379'
volumes:
  pgdata:
