[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# Only redeploy the API when backend files change, not on every app commit
watchPatterns = ["backend/**"]

[deploy]
# Runs once per deploy before the new container starts; a failed migration aborts the deploy.
preDeployCommand = ["npx prisma migrate deploy"]
# Both the API and the worker service use this file; the worker sets ROLE=worker (see README)
startCommand = "node dist/src/main"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
